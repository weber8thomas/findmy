<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="The family’s devices, and the people who share their location, on one private map." />
    <!-- A family's private app: kept out of search engines (also robots.txt and X-Robots-Tag). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- iOS would turn coordinates into phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Link previews. The server makes the image URL absolute when BASE_URL is set. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oukilé" />
    <meta property="og:title" content="Oukilé" />
    <meta property="og:description" content="The family’s devices, and the people who share their location, on one private map." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oukilé" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Oukilé</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
